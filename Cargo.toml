[workspace]
members = ["crates/vici-wasm"]
resolver = "3"

[workspace.package]
edition = "2024"
# Match vici: edition 2024 is the binding constraint.
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dbalmain/beetle"
homepage = "https://github.com/dbalmain/beetle"
authors = ["Dave Balmain <dsbalmain@agiledigital.com.au>"]

[profile.release]
opt-level = 3
lto = true

# Size-opt artefact is phase 6. The profile exists so that build does not
# invent flags later.
[profile.release-size]
inherits = "release"
opt-level = "z"
