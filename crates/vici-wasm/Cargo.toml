[package]
name = "vici-wasm"
version = "0.1.0"
description = "WASM façade for the vici editor"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
# rlib so host `cargo test` can link the crate; cdylib is the wasm artefact.
crate-type = ["cdylib", "rlib"]

[dependencies]
vici = { path = "../../../vici/crates/vici" }
# Pin to the nix `wasm-bindgen-cli` on this machine (0.2.121). Do not let the
# crate and CLI drift.
wasm-bindgen = "=0.2.121"
